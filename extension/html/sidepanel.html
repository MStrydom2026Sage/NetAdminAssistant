<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAdmin Assistant - Analysis</title>
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/sidepanel.css">
</head>
<body>
  <div class="container">
    <header class="sticky-header">
      <h1>NetAdmin Analysis</h1>
      <div class="header-actions">
        <button id="analyzeBtn" class="btn btn-small btn-primary">🔍 Analyze</button>
        <button id="clearCacheBtn" class="btn btn-small btn-ghost">🗑️ Clear Cache</button>
      </div>
    </header>
    <div id="backendStatus" class="status-indicator">Offline rules engine ready</div>
    <div id="results" class="analysis-container"><div class="empty-state"><p>Click “Analyze” to start analyzing the current ticket.</p></div></div>
  </div>
  <section class="analysis-section" aria-label="Support chat">
    <label for="chatInput">Sage / IT support question</label>
    <input id="chatInput" type="text" aria-label="Support question">
    <button id="chatBtn" class="btn btn-small btn-primary">Ask</button>
    <p id="chatReply" role="status"></p>
  </section>
  <script src="../offline-engine.js"></script>
  <script src="../sidepanel.js"></script>
</body>
</html>
