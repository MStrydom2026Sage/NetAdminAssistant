<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAdmin Assistant</title>
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔍 NetAdmin Assistant</h1>
      <p class="version">v0.5.3</p>
    </header>

    <div id="backendStatus" class="status-indicator">Offline rules analysis ready</div>

    <div class="button-group">
      <button id="analyzeBtn" class="btn btn-primary">
        <span>📊 Analyze Ticket</span>
      </button>
      <button id="panelBtn" class="btn btn-secondary">
        <span>📋 Open side panel</span>
      </button>
    </div>

    <div id="status" class="status-message"></div>

    <div id="results" class="results">
      <p class="placeholder">Click "Analyze Ticket" to begin</p>
    </div>
  </div>

  <script src="../popup.js"></script>
</body>
</html>
